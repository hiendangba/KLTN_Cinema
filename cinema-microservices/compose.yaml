services:
  identity-service:
    build:
      context: .
      dockerfile: ./identity-service/Dockerfile
    env_file: ./identity-service/src/main/resources/.env
    ports:
      - "9000:8090"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    env_file: ./user-service/src/main/resources/.env
    ports:
      - "9001:8091"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"


  redis:
    image: redis:7
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # Cổng AMQP để microservices kết nối
      - "15672:15672"   # Cổng UI quản lý RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
      - user-service


volumes:
  pgdata:
  redis_data:
  rabbitmq_data:

