services:
  identity-service:
    build:
      context: .
      dockerfile: ./identity-service/Dockerfile
    env_file: ./identity-service/src/main/resources/.env
    environment:
      USER_GRPC_HOST: user-service
      USER_GRPC_PORT: 9191
      EMAIL_GRPC_HOST: email-service
      EMAIL_GRPC_PORT: 9193
    ports:
      - "9000:8090"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    env_file: ./user-service/src/main/resources/.env
    environment:
      GRPC_SERVER_PORT: 9191
    expose:
      - "9191"
    ports:
      - "9001:8091"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  film-service:
    build:
      context: .
      dockerfile: ./film-service/Dockerfile
    env_file: ./film-service/src/main/resources/.env
    environment:
      GRPC_SERVER_PORT: 9192
    expose:
      - "9192"
    ports:
      - "9002:8092"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  showtime-service:
    build:
      context: .
      dockerfile: ./showtime-service/Dockerfile
    env_file: ./showtime-service/src/main/resources/.env
    environment:
      FILM_GRPC_HOST: film-service
      FILM_GRPC_PORT: 9192
      BOOKING_GRPC_HOST: booking-service
      BOOKING_GRPC_PORT: 9195
    ports:
      - "9004:8094"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - film-service

  email-service:
    build:
      context: .
      dockerfile: ./email-service/Dockerfile
    env_file: ./email-service/src/main/resources/.env
    environment:
      GRPC_SERVER_PORT: 9193
    expose:
      - "9193"
    ports:
      - "9003:8093"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"


  redis:
    image: redis:7
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # Cổng AMQP để microservices kết nối
      - "15672:15672"   # Cổng UI quản lý RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  envoy:
    image: envoyproxy/envoy:v1.31.2
    container_name: api-gateway
    ports:
      - "80:80"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.prod.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "cinema-gateway"]
    depends_on:
      - identity-service
      - user-service
      - film-service
      - showtime-service
      - email-service
volumes:
  pgdata:
  redis_data:
  rabbitmq_data:

