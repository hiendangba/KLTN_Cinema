spring:
  config:
    import: optional:file:src/main/resources/.env[.properties]
  application:
    name: payment-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  grpc:
    client:
      channels:
        booking:
          address: "${BOOKING_GRPC_HOST:localhost}:${BOOKING_GRPC_PORT:9195}"
        cinema:
          address: "${CINEMA_GRPC_HOST:localhost}:${CINEMA_GRPC_PORT:9196}"

server:
  port: ${SERVER_PORT:8098}

vietqr:
  base-url: ${VIETQR_BASE_URL}
  banks-path: ${VIETQR_BANKS_PATH}
  api-key: ${VIETQR_API_KEY}
  secret-key: ${VIETQR_SECRET_KEY}
  sync-cron: ${VIETQR_SYNC_CRON:0 0 3 1 * *}

sepay:
  base-url: ${SEPAY_BASE_URL:https://pgapi-sandbox.sepay.vn}
  merchant-id: ${SEPAY_MERCHANT_ID:replace_me_merchant_id}
  secret-key: ${SEPAY_SECRET_KEY:replace_me_secret_key}
  payment-method: ${SEPAY_PAYMENT_METHOD:QR_DONG_THEO_DON_HANG}
  return-url: ${SEPAY_RETURN_URL:http://localhost:3000/payment/result}
  ipn-url: ${SEPAY_IPN_URL:http://localhost:8098/api/payments/webhooks/sepay}

payment:
  expiration-scheduler-delay-ms: ${PAYMENT_EXPIRATION_SCHEDULER_DELAY_MS:60000}
