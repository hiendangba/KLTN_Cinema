services:
  identity-service:
    image: ${IMAGE_REPO}/identity-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
      JAVA_OPTS: "-Xms64m -Xmx224m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      JPA_DDL_AUTO: "update"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      DB_POOL_MAX_SIZE: "5"
      DB_POOL_MIN_IDLE: "1"
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: identity_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
      USER_GRPC_HOST: user-service
      USER_GRPC_PORT: 9191
      EMAIL_SERVICE_URL: http://email-service:8093/api/email
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-12000000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-259200000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-None}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:?GOOGLE_CLIENT_IDS is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI is required}
      GOOGLE_SUCCESS_REDIRECT_URL: ${GOOGLE_SUCCESS_REDIRECT_URL:-https://cinema-star-ten.vercel.app/movies}
      GOOGLE_FAILURE_REDIRECT_URL: ${GOOGLE_FAILURE_REDIRECT_URL:-https://cinema-star-ten.vercel.app/login}
      GOOGLE_OAUTH_STATE_TTL_MINUTES: ${GOOGLE_OAUTH_STATE_TTL_MINUTES:-5}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      GRPC_SERVER_PORT: 9190
      SERVER_PORT: 8090
    expose:
      - "9190"
      - "8090"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    mem_limit: 448m

