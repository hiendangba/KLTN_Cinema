services:
  identity-service:
    image: ${IMAGE_REPO}/identity-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms64m -Xmx224m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      JPA_DDL_AUTO: "update"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      DB_POOL_MAX_SIZE: "5"
      DB_POOL_MIN_IDLE: "1"
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: identity_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
      USER_GRPC_HOST: user-service
      USER_GRPC_PORT: 9191
      USER_SERVICE_URL: http://user-service:8091/api/users
      EMAIL_SERVICE_URL: http://email-service:8093/api/email
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-12000000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-259200000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-None}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      SERVER_PORT: 8090
    expose:
      - "8090"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    mem_limit: 320m

  user-service:
    image: ${IMAGE_REPO}/user-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      JPA_DDL_AUTO: "update"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      DB_POOL_MAX_SIZE: "6"
      DB_POOL_MIN_IDLE: "1"
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: user_user
      DB_PASSWORD: user_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      GRPC_SERVER_PORT: 9191
      SERVER_PORT: 8091
    expose:
      - "9191"
      - "8091"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    mem_limit: 352m

  film-service:
    image: ${IMAGE_REPO}/film-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms48m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      JPA_DDL_AUTO: "update"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
