  showtime-service:
    image: ${IMAGE_REPO}/showtime-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms48m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      JPA_DDL_AUTO: "update"
      DB_POOL_MAX_SIZE: "4"
      DB_POOL_MIN_IDLE: "1"
      DB_URL: jdbc:postgresql://postgres:5432/showtime_db
      DB_USERNAME: showtime_user
      DB_PASSWORD: showtime_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      USER_SERVICE_URL: http://user-service:8091/api/users
      FILM_SERVICE_URL: http://film-service:8092/api/films
      HALL_SERVICE_URL: http://hall-services:8097/api/halls
      FILM_GRPC_HOST: film-service
      FILM_GRPC_PORT: 9192
      BOOKING_GRPC_HOST: booking-service
      BOOKING_GRPC_PORT: 9195
      CINEMA_GRPC_HOST: cinema-service
      CINEMA_GRPC_PORT: 9196
      HALL_GRPC_HOST: hall-services
      HALL_GRPC_PORT: 9197
      SEAT_GRPC_HOST: seat-service
      SEAT_GRPC_PORT: 9199
      GRPC_SERVER_PORT: 9194
      SERVER_PORT: 8094
    expose:
      - "9194"
      - "8094"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - booking-service
      - film-service
      - hall-services
      - cinema-service
      - seat-service
    mem_limit: 224m

  booking-service:
    image: ${IMAGE_REPO}/booking-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms48m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      JPA_DDL_AUTO: "update"
      DB_POOL_MAX_SIZE: "4"
      DB_POOL_MIN_IDLE: "1"
      DB_URL: jdbc:postgresql://postgres:5432/booking_db
      DB_USERNAME: booking_user
      DB_PASSWORD: booking_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
      CINEMA_GRPC_HOST: cinema-service
      CINEMA_GRPC_PORT: 9196
      SHOWTIME_GRPC_HOST: showtime-service
      SHOWTIME_GRPC_PORT: 9194
      SEAT_GRPC_HOST: seat-service
      SEAT_GRPC_PORT: 9199
      GRPC_SERVER_PORT: 9195
      SERVER_PORT: 8095
      BOOKING_SEAT_LOCK_MINUTES: ${BOOKING_SEAT_LOCK_MINUTES:-5}
      BOOKING_EXPIRATION_SCHEDULER_DELAY_MS: ${BOOKING_EXPIRATION_SCHEDULER_DELAY_MS:-1800000}
    expose:
      - "9195"
      - "8095"
    depends_on:
      - postgres
      - redis
      - cinema-service
    mem_limit: 224m

  payment-service:
    image: ${IMAGE_REPO}/payment-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms48m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      JPA_DDL_AUTO: "update"
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_pass
      BOOKING_GRPC_HOST: booking-service
      BOOKING_GRPC_PORT: 9195
      VIETQR_BASE_URL: https://api.vietqr.io
      VIETQR_BANKS_PATH: /v2/banks
      VIETQR_API_KEY: ${VIETQR_API_KEY:?VIETQR_API_KEY is required}
      VIETQR_SECRET_KEY: ${VIETQR_SECRET_KEY:?VIETQR_SECRET_KEY is required}
      VIETQR_SYNC_CRON: ${VIETQR_SYNC_CRON:-0 0 3 1 * *}
      SEPAY_BASE_URL: ${SEPAY_BASE_URL:-https://pgapi-sandbox.sepay.vn}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:?SEPAY_MERCHANT_ID is required}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:?SEPAY_SECRET_KEY is required}
      SEPAY_PAYMENT_METHOD: ${SEPAY_PAYMENT_METHOD:-QR_DONG_THEO_DON_HANG}
      SEPAY_RETURN_URL: ${SEPAY_RETURN_URL:?SEPAY_RETURN_URL is required}
      SEPAY_IPN_URL: ${SEPAY_IPN_URL:?SEPAY_IPN_URL is required}
      PAYMENT_EXPIRATION_SCHEDULER_DELAY_MS: ${PAYMENT_EXPIRATION_SCHEDULER_DELAY_MS:-60000}
      SERVER_PORT: 8098
    expose:
      - "8098"
    depends_on:
      - postgres
      - booking-service
    mem_limit: 224m

  hall-services:
    image: ${IMAGE_REPO}/hall-services:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms48m -Xmx144m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      DB_POOL_MAX_SIZE: "4"
      DB_POOL_MIN_IDLE: "1"
      DB_URL: jdbc:postgresql://postgres:5432/hall_db
      DB_USERNAME: hall_user
      DB_PASSWORD: hall_pass
      JPA_DDL_AUTO: update
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
      CINEMA_GRPC_HOST: cinema-service
      CINEMA_GRPC_PORT: 9196
      SHOWTIME_GRPC_HOST: showtime-service
      SHOWTIME_GRPC_PORT: 9194
      BOOKING_GRPC_HOST: booking-service
      BOOKING_GRPC_PORT: 9195
      SEAT_GRPC_HOST: seat-service
      SEAT_GRPC_PORT: 9199
      GRPC_SERVER_PORT: 9197
      SERVER_PORT: 8097
    expose:
      - "9197"
      - "8097"
    depends_on:
      - postgres
      - redis
      - cinema-service
    mem_limit: 208m

  seat-service:
    image: ${IMAGE_REPO}/seat-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms48m -Xmx144m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      DB_POOL_MAX_SIZE: "4"
      DB_POOL_MIN_IDLE: "1"
      DB_URL: jdbc:postgresql://postgres:5432/seat_db
      DB_USERNAME: seat_user
      DB_PASSWORD: seat_pass
      JPA_DDL_AUTO: update
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ""
      BOOKING_GRPC_HOST: booking-service
      BOOKING_GRPC_PORT: 9195
      GRPC_SERVER_PORT: 9199
      SERVER_PORT: 8099
    expose:
      - "9199"
      - "8099"
    depends_on:
      - postgres
      - redis
      - booking-service
    mem_limit: 208m

  cinema-service:
    image: ${IMAGE_REPO}/cinema-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms48m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
      JPA_SHOW_SQL: "false"
      JPA_DDL_AUTO: "update"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      DB_POOL_MAX_SIZE: "4"
      DB_POOL_MIN_IDLE: "1"
      DB_URL: jdbc:postgresql://postgres:5432/cinema_db
      DB_USERNAME: cinema_user
      DB_PASSWORD: cinema_pass
      USER_GRPC_HOST: user-service
      USER_GRPC_PORT: 9191
      GRPC_SERVER_PORT: 9196
      SERVER_PORT: 8096
    expose:
      - "9196"
      - "8096"
    depends_on:
      - postgres
    mem_limit: 224m

  email-service:
    image: ${IMAGE_REPO}/email-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      JAVA_OPTS: "-Xms48m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:?MAIL_FROM_NAME is required}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      SERVER_PORT: 8093
    expose:
      - "8093"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    mem_limit: 192m

  postgres:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    mem_limit: 320m

  redis:
    image: redis:7
    container_name: redis-container
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --maxmemory
      - "80mb"
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - "60"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 96m

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 192m

  envoy:
    image: envoyproxy/envoy:v1.31.2
    container_name: api-gateway
    ports:
      - "80:80"
      - "443:443"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.prod.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/certs:/etc/envoy/certs:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "cinema-gateway"]
    mem_limit: 96m

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
