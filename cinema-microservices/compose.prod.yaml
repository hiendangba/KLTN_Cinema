  email-service:
    image: ${IMAGE_REPO}/email-service:${IMAGE_TAG:-dev}
    pull_policy: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
      JAVA_OPTS: "-Xms48m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:?MAIL_FROM_NAME is required}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      SERVER_PORT: 8093
    expose:
      - "8093"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    mem_limit: 160m
  postgres:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    mem_limit: 300m

  redis:
    image: redis:7
    container_name: redis-container
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --maxmemory
      - "80mb"
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - "60"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 96m

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 100m

  envoy:
    image: envoyproxy/envoy:v1.31.2
    container_name: api-gateway
    ports:
      - "80:80"
      - "443:443"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.prod.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/certs:/etc/envoy/certs:ro
    command:
      ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "cinema-gateway"]
    mem_limit: 70m
    networks:
      default: {}
      cinema-shared:
        aliases:
          - cinema-api.duckdns.org
          - cinema-api

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
  upload_data:

networks:
  cinema-shared:
    external: true
    name: cinema-shared
