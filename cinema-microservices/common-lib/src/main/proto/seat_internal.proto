syntax = "proto3";

package cinema.seat.v1;

option java_multiple_files = true;
option java_package = "com.cinema.grpc.seat";
option java_outer_classname = "SeatInternalProto";

service SeatInternalService {
  rpc GetLayoutByHallId(GetLayoutByHallIdRequest) returns (GetLayoutByHallIdReply);
  rpc GetSeatsByCodes(GetSeatsByCodesRequest) returns (GetSeatsByCodesReply);
}

message GetLayoutByHallIdRequest {
  string hall_id = 1;
}

message LayoutProfilePayload {
  string hall_id = 1;
  int32 total_rows = 2;
  int32 total_cols = 3;
  string screen_position = 4;
}

message LayoutSeatPayload {
  string id = 1;
  string hall_id = 2;
  string seat_code = 3;
  int32 row = 4;
  int32 col = 5;
  string seat_type = 6;
}

message LayoutCellPayload {
  string id = 1;
  string hall_id = 2;
  int32 row = 3;
  int32 col = 4;
  string cell_type = 5;
}

message GetLayoutByHallIdReply {
  bool success = 1;
  string error_key = 2;
  string message = 3;
  LayoutProfilePayload profile = 4;
  repeated LayoutSeatPayload seats = 5;
  repeated LayoutCellPayload cells = 6;
}

message GetSeatsByCodesRequest {
  string hall_id = 1;
  repeated string seat_codes = 2;
}

message GetSeatsByCodesReply {
  bool success = 1;
  string error_key = 2;
  string message = 3;
  repeated LayoutSeatPayload seats = 4;
}
