syntax = "proto3";

package cinema.identity.v1;

option java_multiple_files = true;
option java_package = "com.cinema.grpc.identity";
option java_outer_classname = "IdentityInternalProto";

import "common.proto";

service IdentityInternalService {
  rpc LockUserAccount(LockUserAccountRequest) returns (cinema.common.v1.OperationReply);
  rpc UnlockUserAccount(UnlockUserAccountRequest) returns (cinema.common.v1.OperationReply);
}

message LockUserAccountRequest {
  string user_id = 1;
}

message UnlockUserAccountRequest {
  string user_id = 1;
}
