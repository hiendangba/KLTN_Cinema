events {
    worker_connections 1024;
}

http {
    # ===== CACHE =====
    proxy_cache_path /tmp/nginx_cache
        levels=1:2
        keys_zone=api_cache:10m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    log_format cache_log '$remote_addr - [$time_local] '
                         '"$request" $status '
                         'cache=$upstream_cache_status '
                         'upstream_time=$upstream_response_time';

    # ===== THÊM SERVICE MỚI: CHỈ CẦN THÊM Ở ĐÂY (1) =====
    upstream identity_service {
        server host.docker.internal:8090;
        keepalive 32;
    }

    upstream user_service {
        server host.docker.internal:8091;
        keepalive 32;
    }

    upstream film_service {
        server host.docker.internal:8092;
        keepalive 32;
    }

    # upstream booking_service {
    #     server host.docker.internal:8093;
    #     keepalive 32;
    # }

    server {
        listen 80;
        access_log /var/log/nginx/access.log cache_log;

        # ===== AUTH CHECK =====
        location = /auth-check {
            internal;
            proxy_cache off;
            proxy_pass http://identity_service/api/auth/auth-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host identity-service;
        }

        # ===== IDENTITY (không cache) =====
        location /api/auth {
            proxy_cache off;
            proxy_pass http://identity_service;
            proxy_set_header Host identity-service;
        }

        # ===== USER SERVICE =====
        location /api/users {
            auth_request /auth-check;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            proxy_set_header X-User-ID   $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host user-service;

            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$request_method$request_uri$user_id";
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://user_service;
        }

        # ===== FILM SERVICE =====
        location /api/films {
            auth_request /auth-check;
            auth_request_set $user_id   $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            proxy_set_header X-User-ID   $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host film-service;

            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$request_method$request_uri$user_id";
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 2m;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://film_service;
        }

        # ===== THÊM SERVICE MỚI: CHỈ CẦN THÊM Ở ĐÂY (2) =====
        # location /api/booking {
        #     auth_request /auth-check;
        #     ...
        #     proxy_pass http://booking_service;
        # }

        location / {
            return 404 "Not Found\n";
        }
    }
}